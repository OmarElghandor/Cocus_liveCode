openapi: 3.0.3
info:
  title: GitHub Repositories API
  description: |
    API that lists all non-fork GitHub repositories for a given user,
    including branch names and last commit SHA.
    Designed to be consumed by a React + TypeScript frontend.
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /repos/{username}/repositories:
    get:
      summary: List non-fork GitHub repositories for a user
      description: |
        Returns all repositories that are not forks for the given GitHub username.
        For each repository, branch names and last commit SHA are included.
      parameters:
        - name: username
          in: path
          required: true
          description: GitHub username
          schema:
            type: string
        - name: Content-Type
          in: header
          required: true
          description: Request content type must be application/json
          schema:
            type: string
            example: application/json
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
              example:
                - repository_name: my-repo
                  owner_login: octocat
                  branches:
                    - name: main
                      last_commit_sha: a1b2c3d4e5f6
        '400':
          description: Bad request - Username is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
              example:
                status: 400
                message: Username is required
        '406':
          description: Not acceptable header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
              example:
                status: 406
                message: Not acceptable header
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
              example:
                status: 500
                error: GitHub API is currently unavailable
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

components:
  schemas:
    Repository:
      type: object
      required:
        - repository_name
        - owner_login
        - branches
      properties:
        repository_name:
          type: string
          example: my-repo
        owner_login:
          type: string
          example: octocat
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'

    Branch:
      type: object
      required:
        - name
        - last_commit_sha
      properties:
        name:
          type: string
          example: main
        last_commit_sha:
          type: string
          example: a1b2c3d4e5f6

    ErrorResponse400:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Username is required

    ErrorResponse500:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: integer
          example: 500
        error:
          type: string
          example: GitHub API is currently unavailable
